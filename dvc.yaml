stages:
  eda:
    cmd: python -m src.stage1_eda
    deps:
      - data/ratings.csv
      - data/books.csv
      - data/tags.csv
      - data/book_tags.csv
      - src/stage1_eda.py
      - src/config.py
      - src/io_utils.py
    params:
      - min_ratings_popular
    plots:
      - artifacts/figures/rating_distribution.png
      - artifacts/figures/user_activity.png
      - artifacts/figures/book_popularity.png
      - artifacts/figures/rating_vs_count.png
      - artifacts/figures/tags_top20.png
    outs:
      - artifacts/tables/top10_popular_books.csv
      - artifacts/tables/trap_low_counts.csv
      - artifacts/tables/eda_summary.json

  split:
    cmd: python -m src.stage2_split
    deps:
      - data/ratings.csv
      - src/stage2_split.py
      - src/config.py
      - src/io_utils.py
    params:
      - random_state
      - min_train_ratings
      - n_val
      - n_test
    outs:
      - artifacts/split/train.csv
      - artifacts/split/val.csv
      - artifacts/split/test.csv
      - artifacts/split/index_maps.npz
      - artifacts/tables/split_summary.json

  base_models:
    cmd: python -m src.stage3_base_models
    deps:
      - artifacts/split/train.csv
      - artifacts/split/index_maps.npz
      - data/books.csv
      - data/tags.csv
      - data/book_tags.csv
      - src/stage3_base_models.py
      - src/config.py
      - src/io_utils.py
      - src/models.py
    params:
      - random_state
      - relevance_threshold
      - min_ratings_popular
      - content.min_df
    outs:
      - artifacts/models/pop_scores.npy
      - artifacts/models/item_profiles.npz
      - artifacts/models/fav_train.npz
      - artifacts/tables/pop_stats.csv
      - artifacts/tables/popular_top10_train.csv
      - artifacts/tables/similar_books_demo.csv

  itemcf:
    cmd: python -m src.stage4_itemcf
    deps:
      - artifacts/split/train.csv
      - artifacts/split/test.csv
      - artifacts/split/index_maps.npz
      - src/stage4_itemcf.py
      - src/config.py
      - src/io_utils.py
      - src/models.py
    params:
      - random_state
      - relevance_threshold
      - top_k_neighbours
      - shrinkage_lambda
    outs:
      - artifacts/models/R_train.npz
      - artifacts/models/S_topk.npz
      - artifacts/models/item_mean.npy
      - artifacts/tables/itemcf_demo.csv

  svd:
    cmd: python -m src.stage5_svd
    deps:
      - artifacts/split/train.csv
      - artifacts/split/test.csv
      - artifacts/split/index_maps.npz
      - artifacts/models/R_train.npz
      - artifacts/models/S_topk.npz
      - artifacts/models/item_mean.npy
      - src/stage5_svd.py
      - src/config.py
      - src/io_utils.py
      - src/models.py
    params:
      - random_state
      - chunk
      - top_k_neighbours
      - svd.n_factors
      - svd.n_epochs
    metrics:
      - artifacts/tables/rmse_table.csv
    outs:
      - artifacts/models/svd_bundle.npz

  evaluate:
    cmd: python -m src.stage6_evaluate
    deps:
      - artifacts/split/test.csv
      - artifacts/split/index_maps.npz
      - artifacts/models/pop_scores.npy
      - artifacts/models/item_profiles.npz
      - artifacts/models/fav_train.npz
      - artifacts/models/R_train.npz
      - artifacts/models/S_topk.npz
      - artifacts/models/item_mean.npy
      - artifacts/models/svd_bundle.npz
      - src/stage6_evaluate.py
      - src/config.py
      - src/io_utils.py
      - src/metrics.py
      - src/models.py
    params:
      - random_state
      - relevance_threshold
      - n_recs
      - chunk
      - top_k_neighbours
      - svd.n_factors
    metrics:
      - artifacts/tables/metrics_main.csv
    plots:
      - artifacts/figures/metrics_bar.png

  hybrid:
    cmd: python -m src.stage7_hybrid
    deps:
      - artifacts/split/train.csv
      - artifacts/split/val.csv
      - artifacts/split/test.csv
      - artifacts/split/index_maps.npz
      - artifacts/models/pop_scores.npy
      - artifacts/models/item_profiles.npz
      - artifacts/models/fav_train.npz
      - artifacts/models/R_train.npz
      - artifacts/models/S_topk.npz
      - artifacts/models/item_mean.npy
      - artifacts/models/svd_bundle.npz
      - artifacts/tables/metrics_main.csv
      - data/books.csv
      - data/tags.csv
      - data/book_tags.csv
      - src/stage7_hybrid.py
      - src/config.py
      - src/io_utils.py
      - src/metrics.py
      - src/models.py
      - src/features.py
    params:
      - random_state
      - relevance_threshold
      - n_recs
      - chunk
      - min_ratings_popular
      - top_k_neighbours
      - svd.n_factors
      - features.n_clusters
      - hybrid.pool_per_model
      - hybrid.weight_step
      - diversity.max_per_author
      - diversity.max_per_cluster
    metrics:
      - artifacts/tables/metrics_hybrid.csv
    plots:
      - artifacts/figures/metrics_final.png
      - artifacts/figures/segment_bar.png
    outs:
      - artifacts/models/pool_users.npy
      - artifacts/models/pool_books.npy
      - artifacts/models/pool_z.npy
      - artifacts/tables/hybrid_weights.csv
      - artifacts/tables/seg_weights.csv
      - artifacts/tables/segment_table.csv
      - artifacts/tables/diversity_table.csv

  reranker:
    cmd: python -m src.stage8_reranker
    deps:
      - artifacts/split/train.csv
      - artifacts/split/val.csv
      - artifacts/split/test.csv
      - artifacts/split/index_maps.npz
      - artifacts/models/pop_scores.npy
      - artifacts/models/item_profiles.npz
      - artifacts/models/fav_train.npz
      - artifacts/models/R_train.npz
      - artifacts/models/S_topk.npz
      - artifacts/models/item_mean.npy
      - artifacts/models/svd_bundle.npz
      - artifacts/models/pool_users.npy
      - artifacts/models/pool_books.npy
      - artifacts/models/pool_z.npy
      - artifacts/tables/hybrid_weights.csv
      - artifacts/tables/metrics_hybrid.csv
      - data/books.csv
      - data/tags.csv
      - data/book_tags.csv
      - src/stage8_reranker.py
      - src/config.py
      - src/io_utils.py
      - src/metrics.py
      - src/models.py
      - src/features.py
      - src/nn_reranker.py
    params:
      - random_state
      - relevance_threshold
      - n_recs
      - chunk
      - top_k_neighbours
      - features.n_clusters
      - reranker.n_pos
      - reranker.n_neg
      - reranker.n_epochs
      - reranker.batch
      - reranker.lr
      - reranker.emb_dim
      - reranker.rerank_pool
    metrics:
      - artifacts/tables/metrics_reranker.csv
      - artifacts/tables/auc_table.csv
    outs:
      - artifacts/models/reranker_wide_deep.pt
      - artifacts/models/reranker_wide_only.pt

  pipeline_rerun:
    cmd: python -m src.stage9_pipeline
    deps:
      - data/ratings.csv
      - data/books.csv
      - data/tags.csv
      - data/book_tags.csv
      - src/stage9_pipeline.py
      - src/config.py
      - src/io_utils.py
      - src/metrics.py
      - src/models.py
      - src/features.py
      - src/nn_reranker.py
    params:
      - random_state
      - relevance_threshold
      - min_train_ratings
      - n_val
      - n_test
      - n_recs
      - chunk
      - min_ratings_popular
      - top_k_neighbours
      - shrinkage_lambda
      - content.min_df
      - svd.n_factors
      - features.n_clusters
      - hybrid.pool_per_model
      - hybrid.weight_step
      - reranker.n_pos
      - reranker.n_neg
      - reranker.rerank_pool
      - pipeline.user_sample
      - pipeline.svd_epochs
      - pipeline.nn_epochs
    metrics:
      - artifacts/tables/pipeline_result.csv
